<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><title>Match</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1020;--card:#1a1c33;--line:#2c2f52;--text:#f3f4fb;--mute:#9497b8;--acc:#ff6b57;--ok:#5ee6a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:4px 0 16px;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 4px}.mute{color:var(--mute);font-size:14px;margin:2px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:18px;padding:18px 14px;font:inherit}
.mode b{display:block;font-size:17px}.mode span{color:var(--mute);font-size:14px}
button.main{width:100%;border:0;border-radius:12px;padding:13px;font:600 16px inherit;background:var(--acc);color:#2b0a05;margin-top:10px}
button.main:disabled{opacity:.5}.green{background:var(--ok)!important;color:#052a1b!important}
input,select{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#12142a;color:var(--text);font:inherit}
.tag{display:inline-block;background:#262a4d;border-radius:8px;padding:2px 8px;font-size:13px;color:var(--mute);margin-right:6px}
.back{background:none;border:0;color:var(--acc);font:600 15px inherit;padding:0 0 12px}
.empty{text-align:center;color:var(--mute);padding:48px 12px}
.room{background:#17332b;border-radius:10px;padding:8px 10px;margin-top:8px;color:var(--ok);white-space:pre-wrap}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.pos{color:var(--ok)}.neg{color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#12142a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);font:600 12px inherit;padding:14px 0}
nav button.on{color:var(--acc)}
pre{white-space:pre-wrap;font:inherit;margin:0}
</style></head><body>
<div id="view"></div>
<nav><button data-t="play" class="on">Play</button><button data-t="my">My Matches</button><button data-t="results">Results</button><button data-t="wallet">Wallet</button><button data-t="profile">Profile</button></nav>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
try{tg.setHeaderColor("#0f1020");tg.setBackgroundColor("#0f1020")}catch(e){}
const view=document.getElementById("view");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const say=m=>{try{tg.showAlert(m)}catch(e){alert(m)}};
async function api(u,b){
  const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({init:tg.initData},b||{}))});
  if(!r.ok){let t=await r.text();try{t=JSON.parse(t).detail}catch(e){}throw new Error(t)}
  return r.json();
}
let tab="play",mode=null;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;mode=null;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));render()});
async function render(){
  view.innerHTML='<p class="empty">Loading…</p>';
  try{await({play:play,my:my,results:results,wallet:wallet,profile:profile}[tab])()}
  catch(e){view.innerHTML='<p class="empty">Could not load. Please open this app from the bot.</p>'}
}
async function play(){
  if(!mode){
    const ms=await api("/api/modes");
    view.innerHTML="<h1>Play</h1>"+(ms.length?'<div class="grid">'+ms.map(m=>`<button class="mode" data-m="${esc(m.mode)}"><b>${esc(m.mode)}</b><span>${m.count} match${m.count>1?"es":""}</span></button>`).join("")+"</div>":'<p class="empty">No matches right now. Check back soon.</p>');
    view.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
    return;
  }
  const rows=await api("/api/matches",{mode:mode});
  view.innerHTML='<button class="back">‹ Back</button><h1>'+esc(mode)+"</h1>";
  view.querySelector(".back").onclick=()=>{mode=null;render()};
  if(!rows.length)view.innerHTML+='<p class="empty">No open matches.</p>';
  rows.forEach(r=>{
    const full=r.joined>=r.slots,c=document.createElement("div");c.className="card";
    c.innerHTML=`<h2>${esc(r.title)}</h2><p class="mute">${esc(r.start_time)}</p><p class="mute"><span class="tag">Prize: ${esc(r.prize)}</span><span class="tag">${r.fee?esc(r.fee)+" TK entry":"Free entry"}</span><span class="tag">${r.joined}/${r.slots} joined</span></p>`+
      (r.me?'<button class="main" disabled>Joined</button>':full?'<button class="main" disabled>Full</button>':'<input placeholder="Your Free Fire in-game name" maxlength="40"><button class="main">'+(r.fee?"Join for "+esc(r.fee)+" TK":"Join")+"</button>");
    const b=c.querySelector("button.main:not([disabled])");
    if(b)b.onclick=async()=>{
      b.disabled=true;
      try{await api("/api/join",{match_id:r.id,ign:c.querySelector("input").value});say("Joined!")}catch(e){say(e.message)}
      render();
    };
    view.appendChild(c);
  });
}
async function my(){
  const rows=await api("/api/my");
  view.innerHTML="<h1>My Matches</h1>"+(rows.length?"":'<p class="empty">You have not joined any match yet.</p>');
  rows.forEach(r=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<h2>${esc(r.title)}</h2><p class="mute">${esc(r.mode)} · ${esc(r.start_time)}</p><p class="mute">Playing as ${esc(r.ign)}</p>`+
      (r.room?`<div class="room">${esc(r.room)}</div>`:'<p class="mute">Room details will appear here.</p>')+
      (r.result?`<p class="mute"><b>Result:</b> ${esc(r.result)}</p>`:"");
    view.appendChild(c);
  });
}
async function results(){
  const rows=await api("/api/results");
  view.innerHTML="<h1>Results</h1>"+(rows.length?"":'<p class="empty">No results yet.</p>');
  rows.forEach(r=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<h2>${esc(r.title)}</h2><p class="mute">${esc(r.mode)} · ${esc(r.start_time)}</p><pre>${esc(r.result)}</pre>`;
    view.appendChild(c);
  });
}
async function wallet(){
  const w=await api("/api/wallet");
  view.innerHTML=`<h1>Wallet</h1><div class="card"><p class="mute">Available balance</p><h2 style="font-size:32px">${w.balance} TK</h2></div>
  <div class="grid"><button class="main" id="ad">Add Money</button><button class="main green" id="wd">Withdraw</button></div>
  <div id="form"></div><h2 style="margin:22px 0 6px">History</h2><div class="card" id="hist"></div>`;
  const hist=document.getElementById("hist");
  hist.innerHTML=w.txns.length?w.txns.map(t=>`<div class="row"><div><b>${esc(t.kind)}</b><div class="mute">${esc(t.method||t.note||"")} · ${esc(t.status)}</div></div><b class="${t.amount>0?"pos":"neg"}">${t.amount>0?"+":""}${t.amount}</b></div>`).join(""):'<p class="mute">No transactions yet.</p>';
  const form=document.getElementById("form");
  const methods='<select id="m"><option>bKash</option><option>Nagad</option><option>Rocket</option></select>';
  document.getElementById("ad").onclick=()=>{
    form.innerHTML=`<div class="card"><h2>Add Money</h2><pre class="mute">${esc(w.pay)||"Payment number will be added soon."}</pre>${methods}<input id="a" type="number" inputmode="numeric" placeholder="Amount (TK)"><input id="r" placeholder="Transaction ID"><button class="main" id="go">Submit</button></div>`;
    document.getElementById("go").onclick=async e=>{e.target.disabled=true;try{await api("/api/deposit",{amount:a.value,method:m.value,ref:r.value});say("Request sent. You will be notified after approval.");render()}catch(x){say(x.message);e.target.disabled=false}};
  };
  document.getElementById("wd").onclick=()=>{
    form.innerHTML=`<div class="card"><h2>Withdraw</h2><p class="mute">Minimum ${w.minw} TK</p>${methods}<input id="n" inputmode="numeric" placeholder="Mobile number"><input id="a" type="number" inputmode="numeric" placeholder="Amount (TK)"><button class="main green" id="go">Request withdraw</button></div>`;
    document.getElementById("go").onclick=async e=>{e.target.disabled=true;try{await api("/api/withdraw",{amount:a.value,method:m.value,number:n.value});say("Request sent.");render()}catch(x){say(x.message);e.target.disabled=false}};
  };
}
async function profile(){
  const i=await api("/api/info");
  view.innerHTML=`<h1>${esc(i.name)||"Profile"}</h1><div class="card"><p class="mute">Telegram ID: ${esc(i.id)}</p></div>
  <div class="card"><h2>Rules</h2><pre>${esc(i.rules)||"Rules will be added soon."}</pre></div>
  <div class="card"><h2>Support</h2><p class="mute">Need help? Contact us.</p>${i.support?'<button class="main" id="sp">Contact support</button>':""}</div>`;
  const sp=document.getElementById("sp");
  if(sp)sp.onclick=()=>/^https:\/\/t\.me\//.test(i.support)?tg.openTelegramLink(i.support):tg.openLink(i.support);
}
render();
</script></body></html>
